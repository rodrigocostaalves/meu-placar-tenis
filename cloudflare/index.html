<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061722"><title>Deuce Score · Android + Wear OS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#061722;color:#f3f6f2;font:17px/1.6 system-ui,sans-serif}main{max-width:880px;margin:auto;padding:30px 22px 64px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:54px}img{width:86px;height:86px}nav{display:flex;gap:6px}button,a.action{border:1px solid #284c60;background:#10293a;color:#f3f6f2;border-radius:16px;padding:12px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button[aria-pressed=true],a.primary{background:#dbf71c;color:#061722}h1{font-size:clamp(34px,7vw,58px);line-height:1.12;max-width:720px}h1 em{color:#dbf71c;font-style:normal}h2{font-size:23px}p{color:#a6bcc9}.panel{border:1px solid #284c60;background:#10293a;padding:22px;border-radius:22px;margin:25px 0}.actions{display:flex;flex-wrap:wrap;gap:12px}.eyebrow{color:#dbf71c;letter-spacing:2px;font-size:13px}a{color:#dbf71c}small{display:block;color:#a6bcc9;margin-top:16px}#message{white-space:pre-wrap}</style></head>
<body><main><header><img src="icons/share-logo.png" alt="Deuce Score"><nav aria-label="Language"><button data-lang="pt">PT</button><button data-lang="en">EN</button><button data-lang="es">ES</button></nav></header>
<div class="eyebrow">ANDROID + WEAR OS</div><h1 id="title"></h1><p id="intro"></p><div class="actions"><a class="action primary" href="https://deucescore.app/#download" id="download"></a></div><small id="apk"></small>
<section class="panel"><h2 id="featuresTitle"></h2><p id="features"></p><p id="sensors"></p></section>
<section class="panel"><h2 id="paused"></h2><p id="pausedText"></p><button id="export"></button><p id="exportHelp"></p><p id="message" role="status"></p></section>
<section><h2 id="watchTitle"></h2><p id="watch"></p><p id="iphone"></p></section><footer><a href="https://deucescore.app/privacy" id="privacy"></a> · <a href="mailto:suporte@deucescore.app">suporte@deucescore.app</a></footer></main>
<script>
const copy={
pt:{title:'Seu tênis. <em>No celular e no relógio.</em>',intro:'Estamos concentrando o Deuce Score no aplicativo Android e Wear OS.',download:'Baixar app Android',apk:'Arquivo Android atualmente publicado. A instalação do relógio é separada; não instale o APK do celular no relógio.',featuresTitle:'Jogue, registre e acompanhe',features:'Placar livre, histórico, estatísticas, ligas, torneios e compartilhamento do resultado em formato de tênis. No relógio: Start, pontos, pausa, relatório e sincronização com o celular.',sensors:'Calorias e passos dependem das leituras e permissões do relógio. Não solicitamos peso nem calculamos calorias por peso/tempo. Sem sensores, o placar continua funcionando.',paused:'Aplicativo web pausado',pausedText:'Neste momento não é possível cadastrar ou editar partidas pelo navegador. Os serviços utilizados pelo Android continuam mantidos. Esta página não apaga o histórico salvo neste navegador.',export:'Exportar meus dados deste navegador',exportHelp:'A exportação é local e não consulta a nuvem. Abra esta página no mesmo navegador e endereço em que você usava o app. Guarde o arquivo; ele não é importado automaticamente no Android.',empty:'Nenhum histórico local encontrado neste navegador. Seus backups na conta não são consultados por esta página.',saved:'Arquivo de resgate preparado. Guarde-o em local seguro.',error:'Não foi possível ler os dados locais. Não limpe os dados do navegador.',watchTitle:'Como instalar no relógio?',watch:'Durante os testes, instale o módulo wear pelo Android Studio. A distribuição pela Google Play será configurada separadamente; ainda não há instalação automática pelo site.',iphone:'Um aplicativo para iPhone é uma etapa futura, ainda sem data de lançamento. A integração atual é Android + Wear OS, não Apple Watch.',privacy:'Privacidade'},
en:{title:'Your tennis. <em>On phone and watch.</em>',intro:'We are focusing Deuce Score on the Android and Wear OS apps.',download:'Download Android app',apk:'Currently published Android file. Watch installation is separate; do not install the phone APK on your watch.',featuresTitle:'Play, record and track',features:'Flexible scores, history, statistics, leagues, tournaments and tennis-style result sharing. On your watch: Start, points, pause, report and phone sync.',sensors:'Calories and steps depend on watch readings and permissions. We do not request weight or calculate weight/time calories. Scoring still works without sensors.',paused:'Web app paused',pausedText:'Recording and editing matches in the browser is currently paused. Android backend services remain maintained. This page does not erase history stored in this browser.',export:'Export my data from this browser',exportHelp:'Export is local and does not query the cloud. Use the same browser and address as before. Keep the file; it is not imported automatically into Android.',empty:'No local history found in this browser. This page does not query account backups.',saved:'Recovery file prepared. Keep it somewhere safe.',error:'Could not read local data. Do not clear browser storage.',watchTitle:'How do I install on my watch?',watch:'During testing, install the wear module using Android Studio. Google Play distribution will be configured separately; the site does not offer automatic installation yet.',iphone:'An iPhone app is a future stage with no launch date yet. Current integration is Android + Wear OS, not Apple Watch.',privacy:'Privacy'},
es:{title:'Tu tenis. <em>En teléfono y reloj.</em>',intro:'Estamos concentrando Deuce Score en las apps Android y Wear OS.',download:'Descargar app Android',apk:'Archivo Android publicado actualmente. El reloj requiere otra instalación; no instales el APK del teléfono en el reloj.',featuresTitle:'Juega, registra y sigue',features:'Marcador libre, historial, estadísticas, ligas, torneos y resultados para compartir en formato de tenis. En el reloj: Start, puntos, pausa, informe y sincronización.',sensors:'Calorías y pasos dependen de lecturas y permisos del reloj. No solicitamos peso ni calculamos calorías por peso/tiempo. Sin sensores, puedes seguir anotando.',paused:'App web en pausa',pausedText:'Por ahora no puedes registrar o editar partidos en el navegador. Se mantienen los servicios utilizados por Android. Esta página no borra el historial de este navegador.',export:'Exportar mis datos de este navegador',exportHelp:'La exportación es local, sin consultar la nube. Usa el mismo navegador y dirección de antes. Guarda el archivo; no se importa automáticamente en Android.',empty:'No se encontró historial local en este navegador. Esta página no consulta las copias de la cuenta.',saved:'Archivo de recuperación preparado. Guárdalo en un lugar seguro.',error:'No se pudieron leer los datos locales. No borres los datos del navegador.',watchTitle:'¿Cómo instalar en el reloj?',watch:'Durante las pruebas, instala el módulo wear desde Android Studio. La distribución en Google Play se configurará por separado; aún no hay instalación automática desde el sitio.',iphone:'Una app para iPhone es una etapa futura, todavía sin fecha. La integración actual es Android + Wear OS, no Apple Watch.',privacy:'Privacidad'}};
let lang='pt';try{lang=(localStorage.getItem('tennis_lang_v1')||navigator.language||'pt').slice(0,2);}catch(e){}if(!copy[lang])lang='en';
function render(){document.documentElement.lang=lang;for(const [key,value] of Object.entries(copy[lang])){const el=document.getElementById(key);if(el){if(key==='title')el.innerHTML=value;else el.textContent=value;}}document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.getElementById('message').textContent='';}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render();});render();
document.getElementById('export').onclick=()=>{try{
const keys=['tennis_matches_v1','tennis_matches_last_safe_v1','tennis_deleted_matches_v1','tennis_tournaments_v1','tennis_leagues_v1','tennis_friends_v1','tennis_profile_v1'];
const storage={};for(const key of keys){const raw=localStorage.getItem(key);if(raw!==null)storage[key]=raw;}
if(!Object.keys(storage).length){document.getElementById('message').textContent=copy[lang].empty;return;}
const data={format:'deuce-score-browser-rescue-v1',exportedAt:new Date().toISOString(),storage};
const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='deuce-score-browser-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('message').textContent=copy[lang].saved;
}catch(e){document.getElementById('message').textContent=copy[lang].error;}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script></body></html>
