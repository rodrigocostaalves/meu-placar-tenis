<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deuce Score</title>
<style>
  body{
    margin:0; background:#0A2B3D; color:#F3F6F2;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    line-height:1.6; padding: 24px 20px 60px;
    max-width: 720px; margin-left:auto; margin-right:auto;
  }
  h1{ font-size: 26px; margin-bottom: 4px; }
  .subtitle{ color:#8FADBE; font-size: 13px; margin-bottom: 22px; }
  h2{ font-size: 18px; color:#D7F205; margin-top: 32px; margin-bottom: 8px; }
  p, li{ font-size: 15px; color:#F3F6F2; }
  ul{ padding-left: 20px; }
  a{ color:#D7F205; }
  .lang-switch{
    display:flex; gap:8px; margin-bottom: 28px;
  }
  .lang-switch button{
    background:#123A52; border:1px solid #1E4C68; color:#8FADBE;
    border-radius:20px; padding:6px 14px; font-size:13px;
    cursor:pointer; font-family:inherit;
  }
  .lang-switch button.active{
    background:#D7F205; border-color:#D7F205; color:#0A2B3D; font-weight:600;
  }
  .contact-box{
    background: #123A52; border: 1px solid #1E4C68; border-radius:10px;
    padding:14px; margin-top:8px;
  }
</style>
</head>
<body>

<div class="lang-switch">
  <button type="button" data-lang="pt">Português</button>
  <button type="button" data-lang="en">English</button>
  <button type="button" data-lang="es">Español</button>
</div>

<div id="content"></div>

<script>
const CONTACT_EMAIL = 'deucescore@gmail.com';

  <h1>🎾 Deuce Score — Política de Privacidade</h1>
  <div class="subtitle">Última atualização: julho de 2026</div>

  <p>Esta política explica quais dados o Deuce Score coleta, como são usados, e quais são as suas opções. O aplicativo foi feito para ser o mais privado possível: a maior parte dos seus dados nunca sai do seu celular.</p>

  <h2>1. O que fica só no seu aparelho</h2>
  <p>O histórico de partidas, torneios, ligas, fotos, e o restante do seu perfil ficam salvos localmente no armazenamento do navegador do seu celular. Isso nunca é enviado a nenhum servidor, a menos que você use a opção de exportar dados manualmente.</p>

  <h2>2. O que é enviado ao servidor (e por quê)</h2>
  <p>Para que os recursos abaixo funcionem entre aparelhos diferentes, uma quantidade mínima de dados é enviada e guardada em um servidor (Cloudflare):</p>
  <ul>
    <li><strong>Nome e e-mail</strong> — usados para identificar você e permitir que outros jogadores te encontrem por e-mail (convites, confirmação de resultado).</li>

    <li><strong>Inscrição de notificação push</strong> — um identificador técnico do navegador usado para enviar lembretes de partidas agendadas.</li>
    <li><strong>Backup do seu histórico</strong> — se você usar o Backup na Nuvem, suas partidas, torneios e ligas ficam guardados no servidor para poder restaurar em outro aparelho. As fotos das partidas não são enviadas.</li>
    <li><strong>Seu rating e posição no ranking</strong> — o número calculado a partir do seu histórico, junto com seu nome, para montar o ranking geral.</li>
    <li><strong>Anúncios em "Procuro Jogo"</strong> — quando você publica um anúncio, o local que você digitou, a data e sua observação ficam visíveis para outros jogadores até o anúncio expirar. Seu e-mail não é exibido a ninguém.</li>
  </ul>
  <p>Esses dados só são enviados depois que você confirma seu e-mail através de um código de verificação.</p>

  <h2>3. Serviços de terceiros</h2>
  <p>O app usa os seguintes serviços externos, cada um recebendo apenas o mínimo necessário:</p>
  <ul>
    <li><strong>Cloudflare</strong> — hospeda o app e guarda os dados descritos no item 2.</li>
    <li><strong>Zippopotam.us</strong> — converte CEP/ZIP em coordenadas aproximadas.</li>
    <li><strong>Open-Meteo</strong> — fornece previsão do tempo com base em coordenadas.</li>
    <li><strong>OpenStreetMap / Overpass</strong> — busca quadras de tênis públicas próximas.</li>
    <li><strong>Brevo</strong> — envia o e-mail com o código de verificação.</li>
  </ul>
  <p>Nenhum desses serviços recebe seu nome ou identificação pessoal — apenas coordenadas ou o e-mail estritamente necessário para o envio do código.</p>

  <h2>4. O que o app NÃO faz</h2>
  <ul>
    <li>Não exibe anúncios</li>
    <li>Não vende ou compartilha seus dados com terceiros para fins de marketing</li>
    <li>Não rastreia sua localização em tempo real (só usa CEP ou uma localização pontual que você escolhe compartilhar na hora da busca)</li>
    <li>Não acessa seus dados sem que você tenha ativado o recurso correspondente</li>
  </ul>

  <h2>5. Seus direitos e controles</h2>
  <ul>
    <li>Você pode <strong>exportar</strong> todos os seus dados a qualquer momento (Menu → Configurações → Dados)</li>
    <li>Você pode <strong>apagar todos os dados</strong> deste aparelho a qualquer momento (Menu → Configurações → Zona de Risco)</li>
    <li>Você pode <strong>desativar as notificações</strong> a qualquer momento (Menu → Configurações → Notificações)</li>
    <li>Você pode <strong>excluir sua conta</strong> a qualquer momento, pelo próprio app (Menu → Configurações → Zona de Risco → Excluir Minha Conta). Isso remove do servidor seu cadastro, seu rating, seu backup, seus anúncios e seus convites, além de apagar os dados deste aparelho. A ação não pode ser desfeita</li>
    <li>Se preferir, você também pode solicitar a remoção pelo e-mail abaixo</li>
  </ul>

  <h2>6. Menores de idade</h2>
  <p>O Deuce Score não é direcionado especificamente a crianças menores de 13 anos e não coleta intencionalmente dados sabendo que pertencem a essa faixa etária.</p>

  <h2>7. Alterações a esta política</h2>
  <p>Podemos atualizar esta política conforme o app evolui. A data no topo da página sempre reflete a versão mais recente.</p>

  <h2>8. Contato</h2>
  <p>Dúvidas sobre privacidade ou solicitações de remoção de dados:</p>
  <div class="contact-box">
    <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>
  </div>
  `,

  <p>We may update this policy as the app evolves. The date at the top of the page always reflects the most recent version.</p>

  <h2>8. Contact</h2>
  <p>Privacy questions or data removal requests:</p>
  <div class="contact-box">
    <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>
  </div>

const HTML_LANG = { pt: 'pt-BR', en: 'en', es: 'es' };

function pickInitialLang(){
  // 1. explicit ?lang= wins, 2. the language chosen inside the app, 3. browser, 4. pt
  const param = new URLSearchParams(location.search).get('lang');
  if(param && CONTENT[param]) return param;
  try{
    const saved = localStorage.getItem('tennis_lang_v1');
    if(saved && CONTENT[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || '').slice(0,2).toLowerCase();
  if(CONTENT[nav]) return nav;
  return 'pt';
}

function setLang(lang){
  document.getElementById('content').innerHTML = CONTENT[lang];
  document.documentElement.lang = HTML_LANG[lang];
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

setLang(pickInitialLang());
</script>

</body>
</html>
