<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deuce Score</title>
<style>
  body{
    margin:0; background:#0A2B3D; color:#F3F6F2;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    line-height:1.6; padding: 24px 20px 60px;
    max-width: 720px; margin-left:auto; margin-right:auto;
  }
  h1{ font-size: 26px; margin-bottom: 4px; }
  .subtitle{ color:#8FADBE; font-size: 13px; margin-bottom: 22px; }
  h2{ font-size: 18px; color:#D7F205; margin-top: 32px; margin-bottom: 8px; }
  p, li{ font-size: 15px; color:#F3F6F2; }
  ul{ padding-left: 20px; }
  a{ color:#D7F205; }
  .lang-switch{
    display:flex; gap:8px; margin-bottom: 28px;
  }
  .lang-switch button{
    background:#123A52; border:1px solid #1E4C68; color:#8FADBE;
    border-radius:20px; padding:6px 14px; font-size:13px;
    cursor:pointer; font-family:inherit;
  }
  .lang-switch button.active{
    background:#D7F205; border-color:#D7F205; color:#0A2B3D; font-weight:600;
  }
  .contact-box{
    background: #123A52; border: 1px solid #1E4C68; border-radius:10px;
    padding:14px; margin-top:8px;
  }
</style>
</head>
<body>

<div class="lang-switch">
  <button type="button" data-lang="pt">Português</button>
  <button type="button" data-lang="en">English</button>
  <button type="button" data-lang="es">Español</button>
</div>

<div id="content"></div>

<script>
const CONTACT_EMAIL = 'deucescore@gmail.com';

const CONTENT = {
  pt: `
  <h1>🎾 Deuce Score — Política de Privacidade</h1>
  <div class="subtitle">Última atualização: 3 de setembro de 2026</div>

  <p>Esta política explica quais dados o Deuce Score coleta, como são usados e quais são as suas opções no app Android e na versão web. Dados só saem do aparelho quando você conecta a conta ou usa um recurso que precisa funcionar entre jogadores ou aparelhos.</p>

  <h2>1. O que fica só no seu aparelho</h2>
  <p>Histórico de partidas, torneios, ligas, amigos, configurações e foto de perfil ficam salvos no aparelho. Ao conectar uma conta ou ativar o Backup na Nuvem, perfil e histórico podem ser enviados ao servidor para restauração em outro aparelho. A foto de perfil do Android permanece local.</p>

  <h2>2. O que é enviado ao servidor (e por quê)</h2>
  <p>Para que os recursos abaixo funcionem entre aparelhos diferentes, uma quantidade mínima de dados é enviada e guardada em um servidor (Cloudflare):</p>
  <ul>
    <li><strong>Nome, e-mail e perfil</strong> — nome, país, cidade, data de nascimento e CEP/ZIP Code podem ser usados para identificar sua conta, restaurar seu perfil e permitir convites e confirmação de resultados.</li>
    <li><strong>CEP/ZIP code</strong> — convertido em coordenadas aproximadas (nível de cidade/bairro, nunca endereço exato) para mostrar previsão do tempo e quadras próximas.</li>
    <li><strong>Identificador de notificação push</strong> — um identificador técnico do navegador ou Android usado para enviar avisos de convites, partidas, resultados e lembretes.</li>
    <li><strong>Backup do seu histórico</strong> — se você usar o Backup na Nuvem, perfil, partidas, torneios e ligas ficam guardados no servidor para poder restaurar em outro aparelho. Fotos não são enviadas.</li>
    <li><strong>Seu rating e posição no ranking</strong> — o número calculado a partir do seu histórico, junto com seu nome, para montar o ranking geral.</li>
    <li><strong>Anúncios em "Procuro Jogo"</strong> — quando você publica um anúncio, o local que você digitou, a data e sua observação ficam visíveis para outros jogadores até o anúncio expirar. Seu e-mail não é exibido a ninguém.</li>
  </ul>
  <p>Esses dados só são enviados depois que você confirma seu e-mail através de um código de verificação.</p>

  <h2>3. Serviços de terceiros</h2>
  <p>O app usa os seguintes serviços externos, cada um recebendo apenas o mínimo necessário:</p>
  <ul>
    <li><strong>Cloudflare</strong> — hospeda o app e guarda os dados descritos no item 2.</li>
    <li><strong>Zippopotam.us</strong> — converte CEP/ZIP em coordenadas aproximadas.</li>
    <li><strong>Open-Meteo</strong> — fornece previsão do tempo com base em coordenadas.</li>
    <li><strong>OpenStreetMap / Overpass</strong> — busca quadras de tênis públicas próximas.</li>
    <li><strong>Brevo</strong> — envia o e-mail com o código de verificação.</li>
    <li><strong>Firebase Cloud Messaging</strong> — entrega notificações push no Android.</li>
  </ul>
  <p>Cada provedor recebe apenas os dados necessários ao recurso correspondente, como e-mail para verificação, token para notificações ou coordenadas aproximadas para quadras e clima.</p>

  <h2>4. O que o app NÃO faz</h2>
  <ul>
    <li>Não exibe anúncios</li>
    <li>Não vende ou compartilha seus dados com terceiros para fins de marketing</li>
    <li>Não rastreia sua localização em tempo real (só usa CEP ou uma localização pontual que você escolhe compartilhar na hora da busca)</li>
    <li>Não acessa seus dados sem que você tenha ativado o recurso correspondente</li>
  </ul>

  <h2>5. Seus direitos e controles</h2>
  <ul>
    <li>Você pode <strong>exportar</strong> todos os seus dados a qualquer momento (Menu → Configurações → Dados)</li>
    <li>Você pode <strong>apagar todos os dados</strong> deste aparelho a qualquer momento (Menu → Configurações → Zona de Risco)</li>
    <li>Você pode <strong>desativar as notificações</strong> a qualquer momento (Menu → Configurações → Notificações)</li>
    <li>Você pode <strong>excluir sua conta</strong> a qualquer momento, pelo próprio app (Menu → Configurações → Zona de Risco → Excluir Minha Conta). Isso remove do servidor seu cadastro, seu rating, seu backup, seus anúncios e seus convites, além de apagar os dados deste aparelho. A ação não pode ser desfeita</li>
    <li>Se preferir, você também pode solicitar a remoção pelo e-mail abaixo</li>
  </ul>

  <h2>6. Retenção, segurança e exclusão</h2>
  <p>Você pode editar seu perfil, exportar ou importar backup, desligar notificações e excluir a conta no app ou pela página pública de exclusão. A exclusão remove conta, backup, ranking, convites e registros relacionados do servidor, além dos dados locais quando confirmada no app. Usamos conexões seguras para transmissão; nenhum serviço pode garantir segurança absoluta.</p>

  <h2>7. Menores de idade</h2>
  <p>O Deuce Score não é direcionado especificamente a crianças menores de 13 anos e não coleta intencionalmente dados sabendo que pertencem a essa faixa etária.</p>

  <h2>8. Alterações a esta política</h2>
  <p>Podemos atualizar esta política conforme o app evolui. A data no topo da página sempre reflete a versão mais recente.</p>

  <h2>9. Contato</h2>
  <p>Dúvidas sobre privacidade ou solicitações de remoção de dados:</p>
  <div class="contact-box">
    <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>
  </div>
  `,

  en: `

  <p>The app uses the following external services, each receiving only the minimum necessary:</p>

  </ul>

  <h2>4. What the app does NOT do</h2>
  <ul>
    <li>It does not show ads</li>
    <li>It does not sell or share your data with third parties for marketing purposes</li>
    <li>It does not track your location in real time (it only uses your ZIP code, or a one-off location you choose to share at the moment of a search)</li>
    <li>It does not access your data unless you have enabled the corresponding feature</li>
  </ul>

  <h2>5. Your rights and controls</h2>
  <ul>
    <li>You can <strong>export</strong> all of your data at any time (Menu → Settings → Data)</li>
    <li>You can <strong>delete all data</strong> from this device at any time (Menu → Settings → Danger Zone)</li>
    <li>You can <strong>turn off notifications</strong> at any time (Menu → Settings → Notifications)</li>
    <li>You can <strong>delete your account</strong> at any time from within the app (Menu → Settings → Danger Zone → Delete My Account). This removes your registration, rating, backup, posts and invites from the server, and wipes the data on this device. It cannot be undone</li>
    <li>If you prefer, you can also request removal by email at the address below</li>
  </ul>

  <h2>6. Retention, security and deletion</h2>
  <p>You can edit your profile, export or import a backup, turn off notifications and delete your account in the app or from the public deletion page. Deletion removes your account, backup, ranking, invitations and related server records, and removes local data when confirmed in the app. We use secure connections for transmission; no service can guarantee absolute security.</p>

  <h2>7. Children</h2>
  <p>Deuce Score is not specifically directed at children under 13, and does not knowingly collect data belonging to that age group.</p>

  <h2>8. Changes to this policy</h2>
  <p>We may update this policy as the app evolves. The date at the top of the page always reflects the most recent version.</p>

  <h2>9. Contact</h2>
  <p>Privacy questions or data removal requests:</p>
  <div class="contact-box">
    <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>
  </div>
  `,

  es: `

  <p>Dudas sobre privacidad o solicitudes de eliminación de datos:</p>

};

const HTML_LANG = { pt: 'pt-BR', en: 'en', es: 'es' };

function pickInitialLang(){
  // 1. explicit ?lang= wins, 2. the language chosen inside the app, 3. browser, 4. pt
  const param = new URLSearchParams(location.search).get('lang');
  if(param && CONTENT[param]) return param;
  try{
    const saved = localStorage.getItem('tennis_lang_v1');
    if(saved && CONTENT[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || '').slice(0,2).toLowerCase();
  if(CONTENT[nav]) return nav;
  return 'pt';
}

function setLang(lang){
  document.getElementById('content').innerHTML = CONTENT[lang];
  document.documentElement.lang = HTML_LANG[lang];
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

setLang(pickInitialLang());
</script>

</body>
</html>
