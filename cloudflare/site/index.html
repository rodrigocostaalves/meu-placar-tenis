function setLanguage(lang){if(!copy[lang])lang='en';const d=copy[lang];document.documentElement.lang=lang==='pt'?'pt-BR':lang;document.querySelector('meta[name=description]').content=d.lead;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);document.querySelectorAll('[data-html]').forEach(e=>e.innerHTML=d[e.dataset.html]);const features=document.getElementById('features');features.replaceChildren();d.featuresList.forEach(([title,body],i)=>{const e=document.createElement('article');e.className='feature';const number=document.createElement('div');number.className='num';number.textContent='0'+(i+1);const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=body;e.append(number,h,p);features.append(e)});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));try{localStorage.setItem('tennis_lang_v1',lang)}catch(e){}}
