<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Meu Placar de Tênis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0A2B3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Placar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --court: #0A2B3D;
    --court-deep: #061D29;
    --panel: #123A52;
    --panel-line: #1E4C68;
    --chalk: #F3F6F2;
    --muted: #8FADBE;
    --ball: #D7F205;
    --win: #5FCB8D;
    --loss: #E06B4E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{
    margin:0; min-height:100vh;
    background: var(--court);
    font-family:'Inter',sans-serif;
    color: var(--chalk);
    padding-bottom: 100px;
  }
  header.scoreboard{
    background: linear-gradient(180deg, var(--court-deep), var(--court));
    padding: 22px 20px 22px;
    position: relative;
    border-bottom: 2px dashed rgba(243,246,242,0.25);
  }
  .header-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  header.scoreboard h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 1.5px;
    margin: 0;
    display:flex; align-items:center; gap:10px;
  }
  header.scoreboard h1 .ball{
    width:16px; height:16px; border-radius:50%;
    background: var(--ball);
    box-shadow: 0 0 10px rgba(215,242,5,0.6);
    display:inline-block;
  }
  .menu-btn{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    width: 42px; height: 42px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .menu-btn span, .menu-btn span::before, .menu-btn span::after{
    content:''; display:block; width:18px; height:2px;
    background: var(--chalk); position:relative;
  }
  .menu-btn span::before{ position:absolute; top:-6px; }
  .menu-btn span::after{ position:absolute; top:6px; }
  .record{
    display:flex; gap:22px; align-items:flex-end;
  }
  .record-item{
    display:flex; flex-direction:column; align-items:flex-start;
  }
  .record-item .num{
    font-family:'Bebas Neue', sans-serif;
    font-size: 40px;
    line-height:1;
  }
  .record-item .lbl{
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }
  .record-item.wins .num{ color: var(--win); }
  .record-item.losses .num{ color: var(--loss); }
  .record-item.pct .num{ color: var(--ball); font-size: 28px; }
  .streak-line{
    margin-top: 12px; font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .streak-line .streak-val{ font-weight: 700; text-transform: none; letter-spacing: 0; }
  .streak-line .streak-val.win{ color: var(--win); }
  .streak-line .streak-val.loss{ color: var(--loss); }
  .activity-line{ display:flex; gap:10px; margin-top:10px; }
  .activity-chip{
    background: var(--panel); border:1px solid var(--panel-line); color:var(--chalk);
    border-radius:20px; padding:7px 14px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }

  main{ padding: 18px 16px 0; }

  .filters{
    display:flex; flex-direction:column; gap:10px;
    margin-bottom: 16px;
  }
  .search-input{
    width:100%; background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--chalk);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .toggle-group.filter-type{ flex-wrap: wrap; }
  .toggle-group.filter-type button{ font-size: 12.5px; padding: 9px 4px; flex: 1 1 40%; }
  .toggle-group.filter-type button.active{
    background: rgba(215,242,5,0.15); border-color: var(--ball); color: var(--ball);
  }

  .empty{
    text-align:center;
    margin-top: 60px;
    color: var(--muted);
  }
  .empty .ball-big{
    font-size: 40px; margin-bottom: 10px;
  }

  .card{
    background: var(--panel);
    border-left: 5px solid var(--win);
    border-radius: 10px;
    padding: 14px 14px 12px;
    margin-bottom: 12px;
    position: relative;
    cursor: pointer;
  }
  .card.loss{ border-left-color: var(--loss); }
  .card .row1{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 10px;
  }
  .card .opponent{
    font-weight:600; font-size:15px;
  }
  .card .date{
    font-size:12px; color: var(--muted); margin-top:2px;
  }
  .card .result-tag{
    font-family:'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(95,203,141,0.15);
    color: var(--win);
    white-space:nowrap;
  }
  .card.loss .result-tag{
    background: rgba(224,107,78,0.15);
    color: var(--loss);
  }
  .card .score{
    font-family:'Space Mono', monospace;
    font-size: 18px;
    margin-top: 10px;
    letter-spacing: 1px;
  }
  .card .meta{
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .card .del{
    position:absolute; top:10px; right:10px;
    background:none; border:none; color: var(--muted);
    font-size: 18px; cursor:pointer; padding: 4px 8px;
  }
  .card-photo{ width:100%; max-height:140px; object-fit:cover; border-radius:8px; margin-top:10px; display:block; }

  .fab{
    position: fixed; bottom: 24px; left:50%; transform:translateX(-50%);
    background: var(--ball);
    color: var(--court-deep);
    border:none; border-radius: 30px;
    padding: 14px 26px;
    font-family:'Bebas Neue', sans-serif;
    font-size: 16px; letter-spacing: 1px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    cursor:pointer;
  }
  .fab-row{
    position: fixed; bottom: 24px; left:16px; right:16px;
    display:flex; gap:10px; justify-content:center; z-index:9;
  }
  .fab-row .fab{
    position: static; transform:none; flex:1; text-align:center;
    padding: 14px 10px; font-size:14px; white-space:nowrap;
  }
  .fab-secondary{
    background: var(--panel); color: var(--chalk); border:1px solid var(--panel-line);
  }
  #upcomingSection{ margin-bottom: 22px; }
  .upcoming-title{
    font-family:'Bebas Neue', sans-serif; font-size:16px; letter-spacing:1px;
    color:var(--muted); text-transform:uppercase; margin:0 0 10px;
  }
  .upcoming-card{
    background: var(--panel); border-left:5px solid var(--ball); border-radius:10px;
    padding:14px; margin-bottom:12px; position:relative; cursor:pointer;
  }
  .upcoming-card .del{
    position:absolute; top:10px; right:10px; background:none; border:none;
    color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px;
  }
  .upcoming-tag{
    font-family:'Bebas Neue', sans-serif; font-size:12px; letter-spacing:1px;
    padding:3px 10px; border-radius:20px; background: rgba(215,242,5,0.15); color:var(--ball);
    white-space:nowrap;
  }

  .inbox-card{
    background: var(--panel); border-left:5px solid var(--win); border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  .inbox-tag{
    display:inline-block; font-family:'Bebas Neue', sans-serif; font-size:11px; letter-spacing:1px;
    padding:2px 9px; border-radius:20px; background: rgba(95,203,141,0.15); color:var(--win);
    margin-bottom:8px;
  }
  .inbox-text{ font-size:13.5px; margin-bottom:10px; }
  .invite-actions{ display:flex; gap:8px; }
  .invite-actions button{
    flex:1; padding:9px; border-radius:8px; border:none; font-size:13px;
    font-family:'Bebas Neue', sans-serif; letter-spacing:0.5px; cursor:pointer;
  }
  .invite-accept{ background: var(--win); color: var(--court-deep); }
  .invite-dismiss{ background: var(--court); color: var(--muted); border:1px solid var(--panel-line); }

  .overlay{
    position: fixed; inset:0; background: rgba(0,0,0,0.5);
    opacity:0; pointer-events:none; transition: opacity 0.2s;
    z-index: 10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position: fixed; left:0; right:0; bottom:0;
    background: var(--court-deep);
    border-radius: 18px 18px 0 0;
    padding: 20px 20px 24px;
    transform: translateY(105%);
    transition: transform 0.25s ease;
    z-index: 11;
    max-height: 85vh;
    overflow-y:auto;
  }
  .sheet.show{ transform: translateY(0); }
  .sheet h2{
    font-family:'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing:1px; margin: 0 0 16px;
  }
  .sheet h3{
    font-family:'Bebas Neue', sans-serif;
    font-size: 16px; letter-spacing:1px; margin: 22px 0 12px;
    color: var(--muted);
    border-top: 1px dashed var(--panel-line);
    padding-top: 18px;
  }
  .sheet h3:first-of-type{ border-top:none; padding-top:0; margin-top:4px; }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-size:12px; color: var(--muted);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%; background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--chalk);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  .field textarea{ resize: vertical; min-height: 50px; }
  .toggle-group{ display:flex; gap:10px; }
  .toggle-group button{
    flex:1; padding: 12px; border-radius: 8px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--muted);
    font-family:'Bebas Neue', sans-serif;
    font-size:16px; letter-spacing:1px;
    cursor:pointer;
  }
  .toggle-group.type button{ font-size: 13px; padding: 10px 4px; }
  .toggle-group button.active[data-v="V"]{
    background: rgba(95,203,141,0.2); border-color: var(--win); color: var(--win);
  }
  .toggle-group button.active[data-v="D"]{
    background: rgba(224,107,78,0.2); border-color: var(--loss); color: var(--loss);
  }
  .toggle-group.type button.active{
    background: rgba(215,242,5,0.15); border-color: var(--ball); color: var(--ball);
  }
  .lang-group{ display:flex; flex-direction:column; gap:8px; }
  .lang-group button{
    text-align:left;
    padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--chalk);
    font-size:15px;
    cursor:pointer;
  }
  .lang-group button.active{
    border-color: var(--ball); color: var(--ball);
  }
  .sheet-actions{
    display:flex; gap:10px; margin-top: 18px;
  }
  .sheet-actions button{
    flex:1; padding: 13px; border-radius: 8px; border:none;
    font-family:'Bebas Neue', sans-serif; font-size:15px; letter-spacing:1px;
    cursor:pointer;
  }
  .btn-cancel{ background: var(--panel); color: var(--muted); }
  .btn-save{ background: var(--ball); color: var(--court-deep); }

  .sets-wrap{ display:flex; flex-direction:column; gap:8px; }
  .set-row{ display:flex; align-items:center; gap:8px; }
  .set-row .set-num{ font-size:12px; color:var(--muted); width:44px; flex-shrink:0; }
  .set-row input{ width:56px; text-align:center; padding:9px 6px; }
  .set-row .sep{ color:var(--muted); }
  .set-remove{ background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 8px; margin-left:auto; }
  .add-set-btn{
    align-self:flex-start; background:none; border:1px dashed var(--panel-line);
    color:var(--muted); border-radius:8px; padding:8px 14px; font-size:13px;
    cursor:pointer; margin-top:4px; font-family:inherit;
  }

  .stats-list{ display:flex; flex-direction:column; }
  .stat-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px dashed var(--panel-line); font-size:14px;
  }
  .stat-row:last-child{ border-bottom:none; }
  .stat-name{ font-weight:600; }
  .stat-record .sw{ color:var(--win); font-weight:600; }
  .stat-record .sl{ color:var(--loss); font-weight:600; }
  .stats-empty{ color:var(--muted); font-size:13px; padding:8px 0; }
  .tournament-row{ cursor:pointer; }

  .photo-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .avatar-preview, .avatar-placeholder{
    width:56px; height:56px; border-radius:50%; object-fit:cover;
    background:var(--panel); border:1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .photo-preview{ width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--panel-line); }

  .champion-banner{
    background: rgba(215,242,5,0.15); border:1px solid var(--ball); color: var(--ball);
    border-radius:10px; padding:14px; text-align:center; font-family:'Bebas Neue',sans-serif;
    font-size:18px; letter-spacing:1px; margin-bottom:18px;
  }
  .bracket-round{ margin-bottom:20px; }
  .bracket-round h4{
    font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px;
    color:var(--muted); text-transform:uppercase; margin:0 0 10px;
  }
  .bracket-match{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .bracket-player{
    flex:1; background:var(--panel); border:1px solid var(--panel-line); border-radius:8px;
    padding:10px 8px; color:var(--chalk); text-align:center; font-size:13px; cursor:pointer;
    font-family:inherit;
  }
  .bracket-player.winner{ border-color:var(--win); color:var(--win); background:rgba(95,203,141,0.15); font-weight:600; }
  .bracket-player.tbd{ color:var(--muted); opacity:0.5; cursor:default; }
  .bracket-match .vs{ font-size:11px; color:var(--muted); }
</style>
</head>
<body>

<header class="scoreboard">
  <div class="header-top">
    <h1><span class="ball"></span><span data-i18n="appTitle">Meu Placar</span></h1>
    <button class="menu-btn" id="menuBtn"><span></span></button>
  </div>
  <div class="record">
    <div class="record-item wins"><span class="num" id="winsNum">0</span><span class="lbl" data-i18n="winsLabel">Vitórias</span></div>
    <div class="record-item losses"><span class="num" id="lossesNum">0</span><span class="lbl" data-i18n="lossesLabel">Derrotas</span></div>
    <div class="record-item pct"><span class="num" id="pctNum">0%</span><span class="lbl" data-i18n="pctLabel">Aproveitamento</span></div>
  </div>
  <div class="streak-line"><span data-i18n="streakLabel">Sequência</span>: <span class="streak-val" id="streakVal">-</span></div>
  <div class="activity-line">
    <button type="button" class="activity-chip" id="tournamentsShortcut">🏆 <span data-i18n="chipTournament">Torneio</span></button>
    <button type="button" class="activity-chip" id="leaguesShortcut">🏅 <span data-i18n="chipLeague">Liga</span></button>
  </div>
</header>

<main>
  <div id="inboxSection" style="display:none">
    <h3 class="upcoming-title" data-i18n="inboxTitle">Caixa de Entrada</h3>
    <div id="inboxList"></div>
  </div>
  <div id="upcomingSection" style="display:none">
    <h3 class="upcoming-title" data-i18n="upcomingTitle">Próximos Jogos</h3>
    <div id="upcomingList"></div>
  </div>
  <div class="filters">
    <input type="text" id="searchInput" class="search-input" data-i18n-ph="searchPlaceholder" placeholder="Buscar adversário...">
    <div class="toggle-group filter-type">
      <button type="button" data-f="todos" id="filterAll" class="active" data-i18n="filterAll">Todos</button>
      <button type="button" data-f="amistoso" id="filterFriendly" data-i18n="btnFriendly">Amistoso</button>
      <button type="button" data-f="liga" id="filterLeague" data-i18n="btnLeague">Liga</button>
      <button type="button" data-f="campeonato" id="filterChampionship" data-i18n="btnChampionship">Torneio</button>
    </div>
  </div>
  <div id="matchList"></div>
</main>

<div class="fab-row">
  <button class="fab fab-secondary" id="scheduleBtn" data-i18n="btnSchedule">+ Agendar</button>
  <button class="fab" id="addBtn" data-i18n="addBtn">+ Nova Partida</button>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="matchSheet">
  <h2 id="matchSheetTitle">Nova Partida</h2>
  <div class="field">
    <label data-i18n="labelDate">Data</label>
    <input type="date" id="fDate">
  </div>
  <div class="field">
    <label data-i18n="labelTime">Hora (opcional)</label>
    <input type="time" id="fTime">
  </div>
  <div class="field">
    <label data-i18n="labelOpponent">Adversário (opcional)</label>
    <input type="text" id="fOpponent" data-i18n-ph="placeholderOpponent" placeholder="Ex: João">
  </div>
  <div class="field" id="opponentEmailWrap">
    <label data-i18n="labelOpponentEmail">E-mail do Adversário (opcional)</label>
    <input type="email" id="fOpponentEmail">
    <button type="button" class="add-set-btn" id="inviteBtn" style="margin-top:8px" data-i18n="btnInvite">Convidar por notificação</button>
    <button type="button" class="add-set-btn" id="sendResultBtn" style="margin-top:8px; display:none" data-i18n="btnSendResult">Enviar Resultado para Confirmação</button>
  </div>
  <div class="field">
    <label data-i18n="labelFormat">Formato</label>
    <div class="toggle-group type">
      <button type="button" data-fmt="individual" id="btnSingles" data-i18n="btnSingles">Individual</button>
      <button type="button" data-fmt="duplas" id="btnDoubles" data-i18n="btnDoubles">Duplas</button>
    </div>
  </div>
  <div id="doublesFields" style="display:none">
    <div class="field">
      <label data-i18n="labelPartner">Parceiro</label>
      <input type="text" id="fPartner">
    </div>
    <div class="field">
      <label data-i18n="labelOpponent2">Adversário 2 (opcional)</label>
      <input type="text" id="fOpponent2">
    </div>
  </div>
  <div class="field" id="resultFieldWrap">
    <label data-i18n="labelResult">Resultado</label>
    <div class="toggle-group">
      <button type="button" data-v="V" id="btnV" data-i18n="btnWin">Vitória</button>
      <button type="button" data-v="D" id="btnD" data-i18n="btnLoss">Derrota</button>
    </div>
  </div>
  <div class="field">
    <label data-i18n="labelMatchType">Tipo de Partida</label>
    <div class="toggle-group type">
      <button type="button" data-t="amistoso" id="btnFriendly" data-i18n="btnFriendly">Amistoso</button>
      <button type="button" data-t="liga" id="btnLeague" data-i18n="btnLeague">Liga</button>
      <button type="button" data-t="campeonato" id="btnChampionship" data-i18n="btnChampionship">Torneio</button>
    </div>
  </div>
  <div class="field">
    <label data-i18n="labelSurface">Tipo de Quadra</label>
    <div class="toggle-group type">
      <button type="button" data-s="saibro" id="btnClay" data-i18n="btnClay">Saibro</button>
      <button type="button" data-s="rapida" id="btnHard" data-i18n="btnHard">Rápida</button>
      <button type="button" data-s="grama" id="btnGrass" data-i18n="btnGrass">Grama</button>
    </div>
  </div>
  <div class="field" id="setsFieldWrap">
    <label data-i18n="labelSets">Placar (sets)</label>
    <div class="sets-wrap" id="setsContainer"></div>
    <button type="button" class="add-set-btn" id="addSetBtn" data-i18n="addSet">+ Set</button>
  </div>
  <div class="field">
    <label data-i18n="labelLocation">Local (opcional)</label>
    <input type="text" id="fLocation" data-i18n-ph="placeholderLocation" placeholder="Ex: Quadra do clube">
  </div>
  <div class="field">
    <label data-i18n="labelNotes">Observações (opcional)</label>
    <textarea id="fNotes" data-i18n-ph="placeholderNotes" placeholder="Alguma nota sobre o jogo..."></textarea>
  </div>
  <div class="field">
    <label data-i18n="labelMatchPhoto">Foto (opcional)</label>
    <div class="photo-row">
      <img id="mPhotoPreview" class="photo-preview" src="" style="display:none">
      <input type="file" id="mPhotoInput" accept="image/*" style="display:none">
      <button type="button" class="btn-cancel" id="mPhotoBtn" data-i18n="btnChoosePhoto">Escolher Foto</button>
      <button type="button" class="btn-cancel" id="mPhotoRemoveBtn" data-i18n="btnRemovePhoto" style="display:none">Remover</button>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="cancelBtn" data-i18n="btnCancel">Cancelar</button>
    <button class="btn-save" id="saveBtn">Salvar</button>
  </div>
</div>

<div class="sheet" id="menuSheet">
  <h2 data-i18n="menuTitle">Menu</h2>

  <h3 data-i18n="profileTitle">Perfil</h3>
  <div class="field">
    <label data-i18n="labelPhoto">Foto de Perfil</label>

function esc(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Push notifications ----------
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++){
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function ensurePushSubscription(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  if(pushSubscription) return pushSubscription;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const permission = await Notification.requestPermission();
      if(permission !== 'granted') return null;
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    pushSubscription = sub;
    return sub;
  }catch(e){
    console.log('Push subscription error:', e);
    return null;
  }
}

async function syncScheduledMatch(match){
  if(match.result) return; // only sync matches without a result yet
  if(!match.date) return;
  try{
    const sub = await ensurePushSubscription();
    if(!sub) return;
    // Build the Date using the browser's LOCAL timezone, then convert
    // to a proper UTC ISO string so the server (which runs in UTC)
    // interprets the exact same moment in time.
    const localDateTime = new Date(`${match.date}T${match.time || '09:00'}:00`);
    const dateTime = localDateTime.toISOString();
    const res = await fetch('/.netlify/functions/schedule-match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        matchId: match.id,
        subscription: sub.toJSON ? sub.toJSON() : sub,
        dateTime,
        opponent: match.opponent || ''
      })
    });
    if(!res.ok){
      console.log('Schedule-match responded with error:', res.status, await res.text());
    }
  }catch(e){
    console.log('Sync scheduled match error:', e);
  }
}

async function cancelScheduledMatch(matchId){
  try{
    await fetch('/.netlify/functions/cancel-match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matchId })
    });
  }catch(e){
    console.log('Cancel scheduled match error:', e);
  }
}

// ---------- Inbox: Invites + Pending Results ----------
let pendingInvites = [];
let pendingResults = [];

async function sendInvite(){
  const date = $('fDate').value;
  const toEmail = $('fOpponentEmail').value.trim();
  if(!date || !toEmail){ alert(t('inviteNeedInfo')); return; }
  try{
    const profileRaw = localStorage.getItem(PROFILE_KEY);
    const profile = profileRaw ? JSON.parse(profileRaw) : {};
    const localDateTime = new Date(`${date}T${$('fTime').value || '09:00'}:00`);
    const res = await fetch('/.netlify/functions/send-invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fromName: profile.name || t('defaultOpponent'),
        fromEmail: profile.email || '',
        toEmail,
        dateTime: localDateTime.toISOString(),
        opponent: $('fOpponent').value.trim()
      })
    });
    const data = await res.json();
    alert(data.notified ? t('inviteSentNotified') : t('inviteSentNoAccount'));
  }catch(e){
    console.log('Send invite error:', e);
    alert(t('inviteError'));
  }
}

async function sendResult(){
  const toEmail = $('fOpponentEmail').value.trim();
  if(!toEmail || !selectedResult){ alert(t('inviteNeedInfo')); return; }
  try{
    const profileRaw = localStorage.getItem(PROFILE_KEY);
    const profile = profileRaw ? JSON.parse(profileRaw) : {};
    const sets = currentSets.filter(s => s.a !== '' && s.b !== '').map(s => ({a: Number(s.a), b: Number(s.b)}));
    const res = await fetch('/.netlify/functions/send-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fromName: profile.name || t('defaultOpponent'),
        fromEmail: profile.email || '',
        toEmail,
        date: $('fDate').value,
        result: selectedResult,
        sets,
        matchType: selectedType,
        surface: selectedSurface
      })
    });
    const data = await res.json();
    alert(data.notified ? t('resultSentNotified') : t('resultSentNoAccount'));
  }catch(e){
    console.log('Send result error:', e);
    alert(t('resultError'));
  }
}

async function refreshInbox(){
  const profileRaw = localStorage.getItem(PROFILE_KEY);
  const profile = profileRaw ? JSON.parse(profileRaw) : {};
  if(!profile.email){
    pendingInvites = [];
    pendingResults = [];
    renderInbox();
    return;
  }
  try{
    const [invRes, resRes] = await Promise.all([
      fetch('/.netlify/functions/get-invites', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: profile.email })
      }),
      fetch('/.netlify/functions/get-pending-results', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: profile.email })
      })
    ]);
    const invData = await invRes.json();
    const resData = await resRes.json();
    pendingInvites = Array.isArray(invData.invites) ? invData.invites : [];
    pendingResults = Array.isArray(resData.results) ? resData.results : [];
  }catch(e){
    console.log('Refresh inbox error:', e);
  }
  renderInbox();
}

function renderInbox(){
  const section = $('inboxSection');
  const total = pendingInvites.length + pendingResults.length;
  if(total === 0){
    section.style.display = 'none';
    $('inboxList').innerHTML = '';
    return;
  }
  section.style.display = 'block';
  let html = '';
  pendingInvites.forEach(inv => {
    const d = new Date(inv.dateTime);
    const dateStr = isNaN(d.getTime()) ? '' : d.toLocaleString();
    html += `
    <div class="inbox-card">
      <div class="inbox-tag">${t('inviteTag')}</div>
      <div class="inbox-text"><strong>${esc(inv.fromName || '')}</strong> ${t('inviteFromLabel')} ${esc(dateStr)}</div>
      <div class="invite-actions">
        <button data-kind="invite" data-id="${inv.id}" data-action="accepted" class="invite-accept">${t('btnAcceptInvite')}</button>
        <button data-kind="invite" data-id="${inv.id}" data-action="dismissed" class="invite-dismiss">${t('btnDismissInvite')}</button>
      </div>
    </div>`;
  });
  pendingResults.forEach(r => {
    const scoreStr = (r.sets && r.sets.length) ? r.sets.map(s => `${s.a}-${s.b}`).join(', ') : '';
    const claim = r.result === 'V' ? t('claimedWin') : t('claimedLoss');
    html += `
    <div class="inbox-card">
      <div class="inbox-tag">${t('resultTag')}</div>
      <div class="inbox-text"><strong>${esc(r.fromName || '')}</strong> ${claim}${scoreStr ? ' (' + esc(scoreStr) + ')' : ''}</div>
      <div class="invite-actions">
        <button data-kind="result" data-id="${r.id}" data-action="accepted" class="invite-accept">${t('btnAcceptInvite')}</button>
        <button data-kind="result" data-id="${r.id}" data-action="dismissed" class="invite-dismiss">${t('btnDismissInvite')}</button>
      </div>
    </div>`;
  });
  $('inboxList').innerHTML = html;
  $('inboxList').querySelectorAll('button[data-kind="invite"]').forEach(btn => {
    btn.addEventListener('click', () => respondInvite(btn.dataset.id, btn.dataset.action));
  });
  $('inboxList').querySelectorAll('button[data-kind="result"]').forEach(btn => {
    btn.addEventListener('click', () => respondResult(btn.dataset.id, btn.dataset.action));
  });
}

async function respondInvite(inviteId, response){
  try{
    await fetch('/.netlify/functions/respond-invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inviteId, response })
    });
    if(response === 'accepted'){
      const inv = pendingInvites.find(i => i.id === inviteId);
      if(inv){
        const d = new Date(inv.dateTime);
        const newMatch = {
          id: Date.now().toString(),
          date: isNaN(d.getTime()) ? '' : d.toISOString().slice(0,10),
          time: isNaN(d.getTime()) ? '' : d.toTimeString().slice(0,5),
          opponent: inv.fromName || '',
          opponentEmail: inv.fromEmail || '',
          format: 'individual', partner: '', opponent2: '',
          result: null, matchType: 'amistoso', surface: 'rapida', sets: [],
          location: '', notes: '', photo: null
        };
        matches.push(newMatch);
        saveMatches();
        render();
        alert(t('inviteAccepted'));
      }
    }
    refreshInbox();
  }catch(e){
    console.log('Respond invite error:', e);
  }
}

async function respondResult(resultId, response){
  try{
    await fetch('/.netlify/functions/respond-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resultId, response })
    });
    if(response === 'accepted'){
      const r = pendingResults.find(x => x.id === resultId);
      if(r){
        const mirroredResult = r.result === 'V' ? 'D' : 'V';
        const mirroredSets = (r.sets || []).map(s => ({a: s.b, b: s.a}));
        const newMatch = {
          id: Date.now().toString(),
          date: r.date || new Date().toISOString().slice(0,10),
          time: '',
          opponent: r.fromName || '',
          opponentEmail: r.fromEmail || '',
          format: 'individual', partner: '', opponent2: '',
          result: mirroredResult, matchType: r.matchType || 'amistoso', surface: r.surface || 'rapida',
          sets: mirroredSets, location: '', notes: '', photo: null
        };
        matches.push(newMatch);
        saveMatches();
        render();
        alert(t('resultAccepted'));
      }
    }
    refreshInbox();
  }catch(e){
    console.log('Respond result error:', e);
  }
}

function getPlayerId(){
  let id = localStorage.getItem(PLAYER_ID_KEY);
  if(!id){
    id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(PLAYER_ID_KEY, id);
  }
  return id;
}

async function syncPlayerProfile(profile){
  if(!profile.email) return;
  try{
    const sub = await ensurePushSubscription();
    await fetch('/.netlify/functions/save-player', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        playerId: getPlayerId(),
        name: profile.name || '',
        email: profile.email,
        subscription: sub ? (sub.toJSON ? sub.toJSON() : sub) : null
      })
    });
  }catch(e){
    console.log('Sync player profile error:', e);
  }
}

function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function scoreDisplay(m){
  if(m.sets && m.sets.length) return m.sets.map(s => `${s.a}-${s.b}`).join(', ');
  if(m.score) return m.score;
  return '';
}

function typeLabel(mt){
  if(mt === 'liga') return t('btnLeague');
  if(mt === 'campeonato') return t('btnChampionship');
  return t('btnFriendly');
}

function surfaceLabel(s){
  if(s === 'saibro') return t('btnClay');
  if(s === 'grama') return t('btnGrass');
  return t('btnHard');
}

function opponentDisplay(m){
  const base = m.opponent ? esc(m.opponent) : t('defaultOpponent');
  if(m.format === 'duplas' && m.opponent2){
    return `${base} & ${esc(m.opponent2)}`;
  }
  return base;
}

function computeStreak(){
  if(matches.length === 0) return null;
  const sorted = [...matches].sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  const first = sorted[0].result;
  let count = 0;
  for(const m of sorted){
    if(m.result === first) count++;
    else break;
  }
  return { count, type: first };
}

function updateStreakDisplay(){
  const streak = computeStreak();
  const el = $('streakVal');
  if(!streak){
    el.textContent = '-';
    el.className = 'streak-val';
    return;
  }
  const letter = streak.type === 'V' ? t('resultTagWin').charAt(0) : t('resultTagLoss').charAt(0);
  el.textContent = `${streak.count}${letter}`;
  el.className = 'streak-val ' + (streak.type === 'V' ? 'win' : 'loss');
}

function render(){
  const list = $('matchList');
  const wins = matches.filter(m => m.result === 'V').length;
  const losses = matches.filter(m => m.result === 'D').length;
  const total = wins + losses;
  const pct = total ? Math.round((wins/total)*100) : 0;

  $('winsNum').textContent = wins;
  $('lossesNum').textContent = losses;
  $('pctNum').textContent = pct + '%';
  updateStreakDisplay();

  renderUpcoming();

  const completed = matches.filter(m => m.result === 'V' || m.result === 'D');

  if(completed.length === 0){
    list.innerHTML = `<div class="empty"><div class="ball-big">🎾</div>${t('emptyState')}<br>${t('emptyStateHint')}</div>`;
    return;
  }

  let filtered = completed;
  if(typeFilterVal !== 'todos'){
    filtered = filtered.filter(m => m.matchType === typeFilterVal);
  }
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    filtered = filtered.filter(m => (m.opponent || '').toLowerCase().includes(q));
  }

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">${t('noResultsFilter')}</div>`;
    return;
  }

  const sorted = [...filtered].sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  list.innerHTML = sorted.map(m => {
    const scoreStr = scoreDisplay(m);
    const metaParts = [];
    if(m.format === 'duplas' && m.partner) metaParts.push(`${t('labelPartner')}: ${m.partner}`);
    if(m.location) metaParts.push(m.location);
    if(m.notes) metaParts.push(m.notes);
    return `
    <div class="card ${m.result === 'D' ? 'loss' : ''}" data-id="${m.id}">
      <button class="del" data-id="${m.id}">✕</button>
      <div class="row1">
        <div>
          <div class="opponent">${opponentDisplay(m)}</div>
          <div class="date">${formatDate(m.date)} · ${typeLabel(m.matchType)} · ${surfaceLabel(m.surface)}</div>
        </div>
        <div class="result-tag">${m.result === 'V' ? t('resultTagWin') : t('resultTagLoss')}</div>
      </div>
      ${scoreStr ? `<div class="score">${esc(scoreStr)}</div>` : ''}
      ${metaParts.length ? `<div class="meta">${metaParts.map(esc).join(' · ')}</div>` : ''}
      ${m.photo ? `<img class="card-photo" src="${m.photo}" alt="">` : ''}
    </div>
  `;
  }).join('');

  list.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); deleteMatch(btn.dataset.id); });
  });
  list.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const m = matches.find(x => x.id === card.dataset.id);
      if(m) openMatchSheet(m, false);
    });
  });
}

function renderUpcoming(){
  const upcoming = matches.filter(m => !m.result);
  const section = $('upcomingSection');
  if(upcoming.length === 0){
    section.style.display = 'none';
    $('upcomingList').innerHTML = '';
    return;
  }
  section.style.display = 'block';
  const sorted = [...upcoming].sort((a,b) => {
    const da = `${a.date || ''}T${a.time || '00:00'}`;
    const db = `${b.date || ''}T${b.time || '00:00'}`;
    return da.localeCompare(db);
  });
  $('upcomingList').innerHTML = sorted.map(m => {
    const timeStr = m.time ? ` ${m.time}` : '';
    return `
    <div class="upcoming-card" data-id="${m.id}">
      <button class="del" data-id="${m.id}">✕</button>
      <div class="row1">
        <div>
          <div class="opponent">${opponentDisplay(m)}</div>
          <div class="date">${formatDate(m.date)}${timeStr} · ${typeLabel(m.matchType)} · ${surfaceLabel(m.surface)}</div>
        </div>
        <div class="upcoming-tag">${t('upcomingTag')}</div>
      </div>
    </div>
  `;
  }).join('');

  $('upcomingList').querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteMatch(btn.dataset.id);
    });
  });
  $('upcomingList').querySelectorAll('.upcoming-card').forEach(card => {
    card.addEventListener('click', () => {
      const m = matches.find(x => x.id === card.dataset.id);
      if(m) openMatchSheet(m, false);
    });
  });
}

function deleteMatch(id){
  if(!confirm(t('deleteConfirm'))) return;
  const m = matches.find(x => x.id === id);
  matches = matches.filter(m => m.id !== id);
  saveMatches();
  if(m && !m.result){
    cancelScheduledMatch(id);
  }
  render();
}

function openSheet(id){
  $(id).classList.add('show');
  $('overlay').classList.add('show');
}
function closeAllSheets(){

  } else {
    $('matchSheetTitle').textContent = t('sheetTitle');
    $('saveBtn').textContent = t('btnSave');
  }
  $('resultFieldWrap').style.display = schedulingMode ? 'none' : 'block';
  $('setsFieldWrap').style.display = schedulingMode ? 'none' : 'block';
}

function updateMatchPhotoUI(){
  if(currentMatchPhoto){
    $('mPhotoPreview').src = currentMatchPhoto;
    $('mPhotoPreview').style.display = 'block';
    $('mPhotoRemoveBtn').style.display = 'block';
  } else {
    $('mPhotoPreview').style.display = 'none';
    $('mPhotoRemoveBtn').style.display = 'none';
  }
}

function openMatchSheet(matchToEdit, isScheduling){
  schedulingMode = !!isScheduling;
  if(matchToEdit){
    editingId = matchToEdit.id;
    $('fDate').value = matchToEdit.date || '';
    $('fTime').value = matchToEdit.time || '';
    $('fOpponent').value = matchToEdit.opponent || '';
    $('fOpponentEmail').value = matchToEdit.opponentEmail || '';
    $('fPartner').value = matchToEdit.partner || '';
    $('fOpponent2').value = matchToEdit.opponent2 || '';
    $('fLocation').value = matchToEdit.location || '';
    $('fNotes').value = matchToEdit.notes || '';
    setResult(matchToEdit.result || 'V');
    setType(matchToEdit.matchType || 'amistoso');
    setFormat(matchToEdit.format || 'individual');
    setSurface(matchToEdit.surface || 'rapida');
    currentSets = (matchToEdit.sets && matchToEdit.sets.length)
      ? matchToEdit.sets.map(s => ({a: String(s.a), b: String(s.b)}))
      : [{a:'', b:''}];
    currentMatchPhoto = matchToEdit.photo || null;
  } else {
    editingId = null;
    $('fDate').value = new Date().toISOString().slice(0,10);
    $('fTime').value = '';
    $('fOpponent').value = '';
    $('fOpponentEmail').value = '';
    $('fPartner').value = '';
    $('fOpponent2').value = '';
    $('fLocation').value = '';
    $('fNotes').value = '';
    setResult(schedulingMode ? null : 'V');
    setType('amistoso');
    setFormat('individual');
    setSurface('rapida');
    currentSets = [{a:'', b:''}];
    currentMatchPhoto = null;
  }
  $('inviteBtn').style.display = schedulingMode ? 'block' : 'none';
  $('sendResultBtn').style.display = schedulingMode ? 'none' : 'block';
  renderSetsUI();
  updateMatchSheetTexts();
  updateMatchPhotoUI();

function handleSave(){
  const date = $('fDate').value;
  if(!date){ alert(t('alertChooseDate')); return; }
  const sets = currentSets
    .filter(s => s.a !== '' && s.b !== '')
    .map(s => ({a: Number(s.a), b: Number(s.b)}));
  const wasScheduled = editingId ? !matches.find(m => m.id === editingId)?.result : false;
  const matchData = {
    date,
    time: $('fTime').value,
    opponent: $('fOpponent').value.trim(),
    opponentEmail: $('fOpponentEmail').value.trim(),
    format: selectedFormat,
    partner: selectedFormat === 'duplas' ? $('fPartner').value.trim() : '',
    opponent2: selectedFormat === 'duplas' ? $('fOpponent2').value.trim() : '',
    result: schedulingMode ? null : selectedResult,
    matchType: selectedType,
    surface: selectedSurface,
    sets: schedulingMode ? [] : sets,
    location: $('fLocation').value.trim(),
    notes: $('fNotes').value.trim(),
    photo: currentMatchPhoto
  };
  let savedMatch;
  if(editingId){
    const idx = matches.findIndex(m => m.id === editingId);
    if(idx > -1){
      matches[idx] = { ...matches[idx], ...matchData };
      savedMatch = matches[idx];
    }
  } else {
    savedMatch = { id: Date.now().toString(), ...matchData };
    matches.push(savedMatch);
  }
  saveMatches();
  render();
  closeAllSheets();

  if(savedMatch){
    if(!savedMatch.result){
      syncScheduledMatch(savedMatch);
    } else if(wasScheduled){
      cancelScheduledMatch(savedMatch.id);
    }
  }
}

function renderStats(){
  const groups = {};
  matches.forEach(m => {
    const name = (m.opponent || '').trim();
    if(!name) return;
    if(!groups[name]) groups[name] = {w:0, l:0};
    if(m.result === 'V') groups[name].w++; else groups[name].l++;
  });
  const names = Object.keys(groups).sort((a,b) => (groups[b].w + groups[b].l) - (groups[a].w + groups[a].l));
  const container = $('statsContainer');
  if(names.length === 0){
    container.innerHTML = `<div class="stats-empty">${t('statsEmptyState')}</div>`;
    return;
  }
  container.innerHTML = names.map(name => {
    const g = groups[name];
    const wLetter = t('resultTagWin').charAt(0);
    const lLetter = t('resultTagLoss').charAt(0);
    return `<div class="stat-row"><span class="stat-name">${esc(name)}</span><span class="stat-record"><span class="sw">${g.w}${wLetter}</span> - <span class="sl">${g.l}${lLetter}</span></span></div>`;
  }).join('');
}

function exportData(){

    const payload = {
      matches,
      tournaments,
      profile: JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}'),
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'meu-placar-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Export error.');
  }
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm(t('importConfirm'))) return;
      matches = Array.isArray(data.matches) ? data.matches : [];
      tournaments = Array.isArray(data.tournaments) ? data.tournaments : [];
      saveMatches();
      saveTournaments();
      if(data.profile){
        localStorage.setItem(PROFILE_KEY, JSON.stringify(data.profile));
        loadProfile();
      }
      render();
      renderStats();
      renderTournamentsList();
      alert(t('importSuccess'));
    }catch(err){
      alert(t('importError'));
    }
  };
  reader.readAsText(file);
}

function shuffleArr(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateBracket(participants){
  const shuffled = shuffleArr(participants);
  const round0 = [];
  for(let i = 0; i < 16; i += 2){
    round0.push({p1: shuffled[i], p2: shuffled[i+1], winner: null});
  }
  const round1 = Array.from({length: 4}, () => ({p1: null, p2: null, winner: null}));
  const round2 = Array.from({length: 2}, () => ({p1: null, p2: null, winner: null}));
  const round3 = [{p1: null, p2: null, winner: null}];
  return [round0, round1, round2, round3];
}

function setWinner(tour, r, m, winnerName){
  tour.rounds[r][m].winner = winnerName;
  if(r + 1 < tour.rounds.length){
    const nm = Math.floor(m / 2);
    const slot = m % 2 === 0 ? 'p1' : 'p2';
    const nextMatch = tour.rounds[r+1][nm];
    if(nextMatch[slot] !== winnerName){
      nextMatch[slot] = winnerName;
      if(nextMatch.winner){
        nextMatch.winner = null;
        clearDownstream(tour, r+1, nm);
      }
    }
  }
}

function clearDownstream(tour, r, m){
  if(r + 1 >= tour.rounds.length) return;
  const nm = Math.floor(m / 2);
  const slot = m % 2 === 0 ? 'p1' : 'p2';
  const nextMatch = tour.rounds[r+1][nm];
  nextMatch[slot] = null;
  if(nextMatch.winner){
    nextMatch.winner = null;
    clearDownstream(tour, r+1, nm);
  }
}

function renderBracket(){
  const tour = tournaments.find(x => x.id === currentTournamentId);
  if(!tour) return;
  $('bracketTitle').textContent = tour.name;
  const roundNames = [t('roundR16'), t('roundQF'), t('roundSF'), t('roundFinal')];
  let html = '';
  if(tour.champion){
    html += `<div class="champion-banner">🏆 ${t('championLabel')} ${esc(tour.champion)}</div>`;
  }
  tour.rounds.forEach((round, rIdx) => {
    html += `<div class="bracket-round"><h4>${roundNames[rIdx]}</h4>`;
    round.forEach((match, mIdx) => {
      const p1 = match.p1 || t('tbdLabel');
      const p2 = match.p2 || t('tbdLabel');
      const canPick = !!(match.p1 && match.p2);
      html += `<div class="bracket-match">
        <button type="button" class="bracket-player ${match.winner && match.winner === match.p1 ? 'winner' : ''} ${!match.p1 ? 'tbd' : ''}" data-round="${rIdx}" data-match="${mIdx}" data-side="p1" ${canPick ? '' : 'disabled'}>${esc(p1)}</button>
        <span class="vs">×</span>
        <button type="button" class="bracket-player ${match.winner && match.winner === match.p2 ? 'winner' : ''} ${!match.p2 ? 'tbd' : ''}" data-round="${rIdx}" data-match="${mIdx}" data-side="p2" ${canPick ? '' : 'disabled'}>${esc(p2)}</button>
      </div>`;
    });
    html += `</div>`;
  });
  $('bracketContent').innerHTML = html;
  $('bracketContent').querySelectorAll('.bracket-player').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.disabled) return;
      const r = parseInt(btn.dataset.round, 10);
      const m = parseInt(btn.dataset.match, 10);
      const side = btn.dataset.side;
      const tr = tournaments.find(x => x.id === currentTournamentId);
      const match = tr.rounds[r][m];
      const winnerName = side === 'p1' ? match.p1 : match.p2;
      setWinner(tr, r, m, winnerName);
      tr.champion = tr.rounds[tr.rounds.length - 1][0].winner || null;
      saveTournaments();
      renderBracket();
      renderTournamentsList();
    });
  });
}

function pointsForRank(rank){
  if(rank <= 10) return 50 - (rank - 1);
  const bands = [[20,35],[30,28],[40,22],[50,17],[60,13],[70,10],[80,7],[90,5],[100,3]];
  for(const [maxRank, pts] of bands){
    if(rank <= maxRank) return pts;
  }
  return 3;
}

function getLeagueRanking(league){

function updateLeagueWinnerButtons(){
  const lg = leagues.find(x => x.id === currentLeagueId);
  if(!lg) return;
  const p1 = lg.players.find(p => p.id === $('lmP1').value);
  const p2 = lg.players.find(p => p.id === $('lmP2').value);
  $('lmWinP1').textContent = p1 ? p1.name : '';
  $('lmWinP2').textContent = p2 ? p2.name : '';
}

function recordLeagueMatch(winnerSlot){
  const lg = leagues.find(x => x.id === currentLeagueId);
  if(!lg) return;
  const p1Id = $('lmP1').value, p2Id = $('lmP2').value;
  if(p1Id === p2Id){ alert(t('leagueSamePlayer')); return; }
  const ranked = getLeagueRanking(lg);
  const rankOf = (id) => ranked.findIndex(p => p.id === id) + 1;
  const winnerId = winnerSlot === 1 ? p1Id : p2Id;
  const loserId = winnerSlot === 1 ? p2Id : p1Id;
  const loserRank = rankOf(loserId);
  const pts = pointsForRank(loserRank);
  const winner = lg.players.find(p => p.id === winnerId);
  const loser = lg.players.find(p => p.id === loserId);
  winner.points += pts;
  lg.matchLog.push({
    id: Date.now().toString(),
    date: new Date().toISOString().slice(0,10),
    winnerId, loserId,
    winnerName: winner.name, loserName: loser.name,
    points: pts
  });
  saveLeagues();
  closeAllSheets();
  openLeagueDetail(currentLeagueId);
}
